<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create LXC Container</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/lxc.css}">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Create LXC Container</h1>
        <a href="/lxc" class="back-link">&larr; Back to Containers</a>
    </div>

    <div th:if="${error}" class="error-banner">
        <strong>Error:</strong> <span th:text="${error}"></span>
    </div>

    <div class="form-card">
        <form action="/lxc/create" method="post">

            <div class="form-group">
                <label for="name">Container Name</label>
                <input type="text" id="name" name="name" placeholder="my-container" required>
            </div>

            <div class="form-group">
                <label for="template">Template</label>
                <select id="template" name="template">
                    <option value="ubuntu">Ubuntu</option>
                    <option value="debian">Debian</option>
                    <option value="alpine">Alpine</option>
                    <option value="centos">CentOS</option>
                    <option value="fedora">Fedora</option>
                    <option value="download">Download (custom)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="release">Release / Version <span class="hint">(optional — e.g. "focal", "bullseye")</span></label>
                <input type="text" id="release" name="release" placeholder="focal">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Create Container</button>
                <a href="/lxc" class="btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
