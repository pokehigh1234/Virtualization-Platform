<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>KVM Manager</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/index.css}">
</head>
<body>

<div class="container">
    <h1>KVM Web Manager</h1>

    <nav class="top-nav">
        <a href="/" class="nav-link active">KVM Virtual Machines</a>
        <a href="/lxc" class="nav-link">LXC Containers</a>
    </nav>

    <hr>

    <div class="actions">
        <a href="/createvm" class="btn-primary">+ Create VM</a>
    </div>

    <h2>VM List</h2>
    <ul class="vm-list">
        <li th:each="vm : ${vms}" class="vm-item">
            <a th:href="@{/vm/{name}(name=${#strings.trim(#strings.replace(vm, '(stopped)', ''))})}"
               th:text="${vm}" class="vm-link"></a>
        </li>
    </ul>
</div>

</body>
</html>
