<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="'VM: ' + ${vmName}">VM Details</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/vm.css}">
</head>
<body>
<div class="container">
    <div class="header">
        <h1 th:text="'VM: ' + ${vmName}">VM Details</h1>
        <a href="/" class="back-link">&larr; Back to VM List</a>
    </div>

    <div class="vm-info">
        <p><strong>Name:</strong> <span th:text="${vmName}">-</span></p>
    </div>

    <div class="vm-actions">
        <form th:action="@{/vm/{name}/start(name=${vmName})}" method="post" style="display:inline">
            <button type="submit" class="btn-success">Start</button>
        </form>
        <form th:action="@{/vm/{name}/shutdown(name=${vmName})}" method="post" style="display:inline">
            <button type="submit" class="btn-warning">Shutdown</button>
        </form>
        <form th:action="@{/vm/{name}/forceshutdown(name=${vmName})}" method="post" style="display:inline">
            <button type="submit" class="btn-danger"
                    onclick="return confirm('Force shutdown VM?')">Force Shutdown</button>
        </form>
        <form th:action="@{/vm/{name}/delete(name=${vmName})}" method="post" style="display:inline">
            <button type="submit" class="btn-danger"
                    onclick="return confirm('Delete this VM permanently?')">Delete</button>
        </form>
    </div>
</div>
</body>
</html>
